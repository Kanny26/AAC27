    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

cors:
  allowed-origins: http://localhost:5173

jwt:
  secret: test-secret-key-aac27-joyeria-sistema-gestion-2026-muy-larga
  expiration-ms: 28800000
  refresh-expiration-ms: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
