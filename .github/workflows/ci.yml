# =============================================================
# CI de AAC27: compila y prueba backend y frontend en cada push/PR.
# Los dos jobs corren en paralelo y sus logs quedan separados.
# =============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Si se sube otro commit a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: el CI solo necesita leer el código
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # MySQL desechable para JoyeriaApplicationTests (en local usas Docker Compose)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password # valor solo para CI, no es un secreto real
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # El test lee estas variables; sin ellas usaría localhost:3307 (puerto de Compose)
    env:
      AAC27_TEST_MYSQL_BASE_URL: jdbc:mysql://127.0.0.1:3306
      AAC27_TEST_MYSQL_ROOT_PASSWORD: ci_root_password

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (Node + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build